name: Build and push cleancut Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The default docker driver cannot export a build cache; the GHA cache
      # below needs buildx's docker-container driver.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # The Umbrel Home is x86_64; an arm64 leg would roughly double a
          # build that already carries torch and would go unused.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/archerbullseye/cleancut-app:latest
            ghcr.io/archerbullseye/cleancut-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
